name: Profile Summary Cards

on:
  # Automatická aktualizace každý den o půlnoci
  schedule: [{cron: "0 0 * * *"}]
  # Možnost ručního spuštění
  workflow_dispatch:

jobs:
  profile-summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Europe/Prague
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          ls -la profile-summary-card-output || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update profile summary cards"
          git push
