name: Profile Summary Cards

on:
  # Automatická aktualizace každý den o půlnoci
  schedule: [{cron: "0 0 * * *"}]
  # Možnost ručního spuštění
  workflow_dispatch:

jobs:
  profile-summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
